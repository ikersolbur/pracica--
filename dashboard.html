<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Mi Progreso</span>
            <div class="navbar-nav ms-auto">
                <a class="nav-link btn btn-outline-danger btn-sm text-white px-3" href="index.html">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Seguimiento de Salud</h2>

        <div class="card mb-5 bg-light">
            <div class="card-body">
                <form class="row g-3 align-items-end">
                    
                    <div class="col-12 col-md-4">
                        <label class="form-label">Peso actual (kg)</label>
                        <input type="number" step="0.1" class="form-control" placeholder="00.0" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Fecha de registro</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <button type="submit" class="btn btn-success w-100">Registrar Peso</button>
                    </div>

                </form>
                <div class="mt-4">
            <h4 class="mb-3">Historial de Registros</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha</th>
                            <th>Peso Registrado</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>2026-06-25</td>
                            <td>74.5 kg</td>
                            <td><span class="badge bg-secondary">Estable</span></td>
                        </tr>
                    </tbody>
                    <tbody>
                        <tr>
                            <td>2025-06-25</td>
                            <td>67.5 kg</td>
                            <td><span class="badge bg-secondary">Inestable</span></td>
                        </tr>
                    </tbody>
                    <tbody>
                        <tr>
                            <td>2026-03-25</td>
                            <td>78.5 kg</td>
                            <td><span class="badge bg-secondary">Estable</span></td>
                        </tr>
                    </tbody>
                    <tbody>
                        <tr>
                            <td>2026-06-25</td>
                            <td>59.5 kg</td>
                            <td><span class="badge bg-secondary">Estable</span></td>
                        </tr>
                    </tbody>
                    <tbody>
                        <tr>
                            <td>2024-06-25</td>
                            <td>94.5 kg</td>
                            <td><span class="badge bg-secondary">Estable</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div style="position: relative; max-width: 800px; margin: auto;">
  <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line', // Tipo de gráfica de línea
    data: {
      // Fechas ordenadas cronológicamente
      labels: ['2024-06-25', '2025-06-25', '2026-03-25', '2026-06-25 (A)', '2026-06-25 (B)'],
      datasets: [{
        label: 'Progreso de Peso',
        // Pesos correspondientes en kg
        data: [94.5, 67.5, 78.5, 74.5, 59.5],
        
        // Estilos de la línea
        borderColor: '#3b82f6',          // Azul moderno
        backgroundColor: 'rgba(59, 130, 246, 0.1)', // Sombreado suave debajo de la línea
        borderWidth: 3,                  // Grosor de la línea
        tension: 0.3,                    // Curvatura elegante en las uniones

        // Estilos de los puntos de datos
        pointBackgroundColor: '#ef4444', // Puntos rojos para identificar los días exactos
        pointRadius: 6,                  // Tamaño del punto
        pointHoverRadius: 8              // Tamaño al pasar el cursor sobre el punto
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'top',
        }
      },
      scales: {
        y: {
          beginAtZero: false, // Empieza cerca del peso mínimo para que se noten mejor los cambios
          title: {
            display: true,
            text: 'Peso (kg)',
            font: { weight: 'bold' }
          }
        },
        x: {
          title: {
            display: true,
            text: 'Fecha de Registro',
            font: { weight: 'bold' }
          }
        }
      }
    }
  });
</script>
            </div>
        </div>

        

    </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
